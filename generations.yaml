generations:
  - name: "First Generation Pre-Facelift (AZ10)"
    start_year: 2014
    end_year: 2017
    description: "The first generation Lexus NX 300h was the hybrid variant of the first-generation Lexus NX compact luxury crossover SUV, introduced in late 2014. Powered by a third-generation hybrid system combining a 2.5-liter 2AR-FXE four-cylinder engine with electric motors and paired with an electronically controlled continuously variable transmission (eCVT), delivering a combined system output of 145 horsepower. This hybrid powertrain provided excellent fuel efficiency while maintaining strong acceleration for the segment. The NX 300h was positioned between the naturally aspirated NX 200 and the turbocharged NX 200t models. The first-generation NX featured Lexus's distinctive spindle grille design and compact, distinctive styling with unique suspension parts, interior, and level of luxury distinguishing it from the related Toyota RAV4. US sales began in November 2014, with production commencing on August 8, 2014 at Toyota Motor Kyushu's Miyata plant. The pre-facelift model featured the original front bumper, grille, and headlamp design that defined the NX's initial market entry."

  - name: "First Generation Facelift (AZ10)"
    start_year: 2017
    end_year: 2021
    description: "In September 2017, the Lexus NX received a mid-life facelift that revised the front bumper, grille, headlamps, and taillights while maintaining the core AZ10 platform. The front bumper, grille, and headlamps were significantly revised, as were the taillights and dashboard. The tailgate also received new sheetmetal, echoing Lexus's 'spindle motif' grille design. Equipment levels were boosted with a new safety package (Lexus Safety System+) and an optional head-up display becoming available. The NX 200t was renamed to NX 300 after the facelift to unify marketing efforts with the NX 300h hybrid model. The powertrain remained unchanged, with the NX 300h continuing to use the 2.5-liter hybrid system. Production continued through November 2021 before being replaced by the all-new second-generation AZ20 platform."

  - name: "Second Generation (AZ20)"
    start_year: 2021
    end_year: null
    description: "The Lexus NX 350h represents the hybrid variant of the second-generation Lexus NX compact luxury crossover, replacing the previous NX 300h model with significant improvements in power, efficiency, and technology. Powered by a fourth-generation hybrid system combining a 2.5-liter A25A-FXS four-cylinder engine with electric motors for a total system output of 239 horsepower (a 45 horsepower increase over its predecessor), paired with an electronically controlled continuously variable transmission (eCVT). This powertrain delivers excellent fuel economy while offering significantly improved acceleration. Standard all-wheel drive features a dedicated rear electric motor providing seamless power distribution between front and rear wheels. The exterior design evolved with a more sophisticated interpretation of the spindle grille, sleeker overlapping L-shape daytime running lamps, and a connected taillight design. The interior represents a major advancement with the new Lexus Interface multimedia system featuring a standard 9.8-inch or available 14-inch touchscreen display with wireless Apple CarPlay and Android Auto, cloud-based navigation, and native voice assistant capabilities. This system replaces the previous Remote Touch interface with more intuitive controls, including physical buttons for frequently used functions. Driver assistance technology expanded with Lexus Safety System+ 3.0 including enhanced pre-collision system with motorcycle detection, intersection support, and emergency steering assist. Additional features include a digital key system allowing smartphone access, wireless smartphone charging, and a digital rearview mirror. As the first hybrid model to adopt the new numerical naming convention (previous hybrid models used 'h' designations like 300h), the NX 350h positions itself as a premium hybrid crossover built on the TNGA: GA-K platform shared with the Toyota Venza/Harrier and RAV4."